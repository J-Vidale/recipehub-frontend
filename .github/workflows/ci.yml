name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build is a real check here: an unresolved import or a bad JSX
      # transform fails here and nowhere else.
      - name: Build
        run: npm run build

      # Blocking, but only on high and critical. A moderate advisory can
      # land against a transitive production dependency at any time, often
      # with no fix published yet, and that should not stop an unrelated
      # change from shipping - the advisory job below still reports it.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  audit-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit everything (advisory)
        run: npm audit --audit-level=low || true
